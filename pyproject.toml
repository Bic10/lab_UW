[tool.poetry]
name = "lab_uw"
version = "0.1.0"
description = "Software for the analysis of ultrasonic waveforms probing a Rock Mechanics Experiment"
authors = ["micheledesolda <micheledesolda@yahoo.it>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "3.10.12"
numpy = "^2.1.3"
scipy = "^1.14.1"
pandas = "^2.2.3"
matplotlib = "^3.9.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
