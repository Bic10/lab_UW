[tool.poetry]
name = "lab_uw"
version = "0.1.0"
description = "Software for the analysis of ultrasonic waveforms probing a Rock Mechanics Experiment"
authors = ["micheledesolda <micheledesolda@yahoo.it>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "3.10.12"
numpy = "^2.1.3"
scipy = "^1.14.1"
pandas = "^2.2.3"
matplotlib = "^3.9.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
sphinx = "^8.1.3"
sphinx-autodoc-typehints = "^2.5.0"
sphinx-rtd-theme = "^3.0.2"
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.poetry.scripts]
build-docs = "sphinx.cmd.build:main"

